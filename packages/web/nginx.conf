# Site (SPA) servido pela imagem nginx-unprivileged: escuta na 8080 e roda sem root.
# O /api e o /socket.io não passam por aqui: o Traefik do Dokploy os manda direto ao servidor.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # O site não recebe formulários nem uploads.
  client_max_body_size 1k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Arquivos ocultos (.algo) nunca são servidos.
  location ~ /\. {
    return 404;
  }

  # SPA: rotas desconhecidas caem no index.html, que não fica em cache (aponta para os
  # arquivos com hash do build atual).
  location / {
    include /etc/nginx/snippets/cabecalhos.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Imagem da prévia de links (Open Graph): buscada por robôs e exibida por outros sites
  # (WhatsApp, Teams…), então não leva o Cross-Origin-Resource-Policy same-origin do include.
  location = /og-imagem.png {
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location /assets/ {
    include /etc/nginx/snippets/cabecalhos.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
