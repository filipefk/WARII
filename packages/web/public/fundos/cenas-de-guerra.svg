<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 360" width="1600" height="360">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#090d12"/><stop offset=".55" stop-color="#171512"/><stop offset="1" stop-color="#21150f"/></linearGradient>
  <linearGradient id="horizon" x2="0" y2="1"><stop stop-color="#b65b2e" stop-opacity=".0"/><stop offset=".55" stop-color="#b65b2e" stop-opacity=".17"/><stop offset="1" stop-color="#e18a4a" stop-opacity=".02"/></linearGradient>
