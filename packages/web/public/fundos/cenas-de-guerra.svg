<g fill="#211d19" opacity=".55" filter="url(#blur)">
 <path d="M610 263Q574 211 628 175Q594 132 647 101Q620 58 671 28Q720 1 738 54Q772 91 725 126Q765 167 724 201Q760 235 715 269Z"/>
