<ellipse cx="690" cy="250" rx="320" ry="125" fill="url(#fire)"/>
<ellipse cx="1260" cy="250" rx="240" ry="110" fill="url(#fire)" opacity=".7"/>
<ellipse cx="145" cy="260" rx="170" ry="90" fill="url(#fire)" opacity=".55"/>
