# Cabeçalhos de segurança do site, incluídos em cada `location` do nginx.conf (um add_header
# dentro de uma location descarta os herdados do server, então todas repetem este include).
#
# CSP: tudo da própria origem. Scripts só dos arquivos do build (nada inline, nada de eval).
# Estilos aceitam 'unsafe-inline' por causa dos atributos style do React/SVG. connect-src 'self'
# cobre a API (/api) e o WebSocket (/socket.io) no mesmo domínio. data: só para imagens
# pequenas que o Vite embute no CSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
